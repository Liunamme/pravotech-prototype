# Раздача статической сборки прототипа. Используется только образом из
# `Dockerfile`; на GitHub Pages не применяется (там свой сервер и свои,
# ненастраиваемые заголовки).

server {
  # Не 80: процесс работает не от root и не может занять привилегированный порт.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Версия nginx в заголовке ответа — бесплатная подсказка тому, кто ищет
  # известную дыру под конкретный релиз.
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Ассеты собираются с хешем в имени, поэтому их можно кэшировать навсегда:
  # новая сборка — новое имя файла.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # Сам index.html кэшировать нельзя: он и есть точка, через которую
  # пользователь узнаёт про новую сборку.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    # Роутинг — HashRouter, поэтому серверные переписывания путей не нужны:
    # `/#/w/obligations/...` целиком остаётся на стороне браузера. `=404`
    # честнее, чем отдавать index.html на любой промах.
    try_files $uri $uri/ =404;
  }

  # Заголовки безопасности. Ради них в том числе и нужен свой хостинг:
  # на GitHub Pages произвольные заголовки ответа настроить нельзя.
  #
  # CSP описывает ровно то, что делает прототип: свои скрипты и стили, шрифты
  # из собственной сборки, никаких внешних запросов. `style-src` вынужденно
  # разрешает inline — Radix проставляет позиционирование всплывающих слоёв
  # атрибутом style. Когда появится настоящий API, в `connect-src` нужно
  # добавить его origin — и только его.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  # HSTS включать только когда домен реально работает по https, иначе можно
  # запереть себя на домене без сертификата.
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
