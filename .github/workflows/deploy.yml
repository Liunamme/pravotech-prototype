# Сборка и публикация прототипа ПравоТех на GitHub Pages.
#
# Включить один раз: Settings → Pages → Source → «GitHub Actions».
# Дальше каждый push в main пересобирает и публикует.
#
# Работает без правки base под имя репозитория: vite.config использует
# base: './' (относительные пути к ассетам), а роутинг — HashRouter,
# поэтому deep-links вида /#/w/obligations/... не требуют серверных редиректов.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Отменяем предыдущий незавершённый деплой при новом push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Публикуется только то, что прошло линт, типы, тесты, прогон агента и
  # аудит зависимостей (`ci.yml`).
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck & build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
